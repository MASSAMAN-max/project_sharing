<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 環境依存パラメータ（LIFF_ID等）はメイン処理より前に読み込む -->
<script src="config.js"></script>
<!-- 共通スタイル（index.html・share.html で共有）。ページ固有の指定は、下のstyleタグに書く -->
<link rel="stylesheet" href="common.css">

<title>案件共有 - 送信方法を選択</title>
<style>
  /* body・.card（共通部分）・.btn・.line-btn・#stateBox は common.css に置いている */
  .card {
    padding: 20px;
    margin: 60px auto 20px auto;
    text-align: center;
  }

  h2 {
    font-size: 18px;
    margin-top: 0;
    color: #000;
  }

  .fb-btn { background: #0084ff; }
  .copy-btn { background: #666; }

  /* LINEボタンの「準備中」表示（要約情報の取得が終わるまで押せない） */
  .btn.is-disabled { opacity: 0.5; pointer-events: none; }
</style>
</head>
<body>

  <div id="stateBox">
    <div>読み込んでいます…</div>
  </div>

  <div id="app" style="display:none;"></div>

  <script>
    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function showState(message, isError) {
      const box = document.getElementById("stateBox");
      box.style.display = "block";
      document.getElementById("app").style.display = "none";
      box.innerHTML = isError
        ? `<div style="color:#d33; font-weight:bold;">⚠️ ${message}</div>`
        : `<div>${message}</div>`;
    }

    function copyText(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "absolute";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, 99999);
      document.execCommand("copy");
      document.body.removeChild(ta);
    }

    // 案件の要約情報（タイトル・発注元・担当者・住所）を取得する。
    // このページは元々GAS通信を一切行わない設計だったが、LINE共有時に
    // 「案件共有」という固定文言ではなく実際の案件情報を表示したい、
    // という要望に対応するため追加した。
    // 失敗しても致命的ではない（リンクだけのシンプルな文言にフォール
    // バックする）ため、エラーは投げずnullを返すだけにしている。
    // GASが応答しない場合でもLINEボタンが「準備中」のまま止まらないよう、
    // 8秒でタイムアウトして失敗扱い（null）にする。
    async function fetchShareSummary(token) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      try {
        const response = await fetch(`/api/share-info?token=${encodeURIComponent(token)}`, {
          signal: controller.signal
        });
        if (!response.ok) return null;
        const data = await response.json();
        if (data.error) return null;
        return data;
      } catch (err) {
        console.error("❌ 案件要約情報の取得に失敗しました:", err);
        return null;
      } finally {
        clearTimeout(timeoutId);
      }
    }

    // LINE共有文言を組み立てる。summaryが取得できていれば案件名・発注元・
    // 担当者・住所を含む文章に、取得できなければURLのみのシンプルな
    // 文言にフォールバックする。
    // GAS側は未入力の項目を "--" で返すため、"--" と空文字は「値なし」
    // として扱い、LINEの本文には載せない（"--" がそのまま送られるのを防ぐ）。
    function buildShareText(summary, liffUrl) {
      if (!summary) {
        return liffUrl;
      }

      const hasValue = (v) => v && v !== "--";

      const lines = [summary.title || "案件詳細"];

      if (hasValue(summary.client)) {
        lines.push(hasValue(summary.staff)
          ? `${summary.client}（${summary.staff} 様）`
          : summary.client);
      }
      if (hasValue(summary.address)) {
        lines.push(summary.address);
      }

      // 案件情報とURLの間に空行を1つ入れる
      lines.push("", liffUrl);
      return lines.join("\n");
    }

    (async function init() {
      const token = getQueryParam("token");
      if (!token) {
        showState("URLに共有トークン（?token=...）が指定されていません", true);
        return;
      }

      // -------------------------------------------------------------
      // 【設計方針】このページの基本方針は「軽量な選択画面」だが、
      // LINE共有時に案件名等を表示したいという要望に対応するため、
      // 案件の要約情報（タイトル・発注元・担当者・住所）だけを取得する
      // 軽量なAPI（/api/share-info、認証不要）への通信を1回だけ行う。
      // 「誰が」共有しようとしているかの認証は行わない。
      // 実際の認証（本人確認）は、リンク先の index.html 側で行われる。
      //
      // ・LINE送信　　　　→ 案件名等を含む文章＋LIFF URLをLINEの共有画面に渡す
      //     （相手がLIFF経由で開くことで、開いた本人のLINEuserIdを
      //      自動取得できるようにするため）
      // ・Messenger送信　→ /api/share（OGP付き中継ページ）のURLを渡す
      // ・コピー　　　　　→ 同じく /api/share のURLをコピーする
      // -------------------------------------------------------------
      const shareUrl = `${window.location.origin}/api/share?token=${encodeURIComponent(token)}`;
      const liffUrl = `https://liff.line.me/${CONFIG.LIFF_ID}?token=${encodeURIComponent(token)}`;

      // 【速度改善】案件の要約情報の取得（GASへの問い合わせ）を待たずに、先に画面を表示する。
      // Messenger・URLコピーは要約情報が不要なので、すぐに使える。
      // LINE送信だけは、案件名等を含む文言を作るために要約情報が必要なので、
      // 取得できるまで「準備中」の表示にしておき、取得後に有効化する
      // （取得に失敗した場合は、URLのみの文言で有効化する）。
      const html = `
        <div class="card">
          <h2>送信方法を選択してください</h2>
          <p id="summaryTitle" hidden style="text-align:left; color:#555; font-size:13px;"></p>
          <a id="lineBtn" class="btn line-btn is-disabled" role="button" aria-disabled="true">📩 LINEで送る（準備中…）</a>
          <button id="msgBtn" class="btn fb-btn">💬 Messengerで送る</button>
          <button id="copyBtn" class="btn copy-btn">🔗 URLをコピー</button>
        </div>
      `;

      const app = document.getElementById("app");
      app.innerHTML = html;
      app.style.display = "block";
      document.getElementById("stateBox").style.display = "none";

      document.getElementById("msgBtn").addEventListener("click", () => {
        copyText(shareUrl);
        alert("案件URLをコピーしました。Messengerに貼り付けてください。");
        window.open("https://m.me/", "_blank");
      });
      document.getElementById("copyBtn").addEventListener("click", () => {
        copyText(shareUrl);
        alert("案件URLをコピーしました。");
      });

      // 要約情報が取得できたら、案件名を表示し、LINEボタンを有効化する
      fetchShareSummary(token).then(summary => {
        if (summary) {
          const titleElement = document.getElementById("summaryTitle");
          titleElement.textContent = summary.title || "";
          titleElement.hidden = false;
        }

        const shareText = buildShareText(summary, liffUrl);
        const lineButton = document.getElementById("lineBtn");
        // LINEのWeb共有画面はスマートフォン向けで、PCでは宛先選択へ進まず
        // LINE公式ページが表示される。そのためPCでは共有文をコピーし、
        // LINEアプリのトークへ貼り付ける案内に切り替える。
        const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        if (isMobile) {
          lineButton.href = "https://line.me/R/share?text=" + encodeURIComponent(shareText);
          lineButton.target = "_blank";
          lineButton.rel = "noopener";
        } else {
          lineButton.href = "#";
          lineButton.addEventListener("click", (event) => {
            event.preventDefault();
            copyText(shareText);
            alert("LINEで送る文章をコピーしました。LINEのトークに貼り付けて送信してください。");
          });
        }
        lineButton.textContent = "📩 LINEで送る";
        lineButton.classList.remove("is-disabled");
        lineButton.removeAttribute("aria-disabled");
      });
    })();
  </script>

</body>
</html>
